name: Metaculus - forecast new questions

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. Questions stay open for 1.5 hours, so each one gets
    # about three chances. Runs that find nothing new take under a minute.
    - cron: "7,37 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: metaculus-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: metaculus-bot/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('metaculus-bot/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: poetry run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional overrides, set under Settings -> Secrets and variables -> Actions -> Variables.
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          FORECAST_REASONING: ${{ vars.FORECAST_REASONING }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
          MAX_QUESTIONS_PER_RUN: ${{ vars.MAX_QUESTIONS_PER_RUN }}
          MAX_COST_PER_RUN_USD: ${{ vars.MAX_COST_PER_RUN_USD }}
