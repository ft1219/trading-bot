name: Bots - every 40 minutes

# The first job asks Metaculus, with nothing but the runner's built-in Python,
# whether any open question needs a forecast, so a run with nothing to
# forecast is billed as one GitHub Actions minute. The forecast job, which
# installs third-party packages, starts only when a question needs a
# forecast. Neither of those jobs can write to the repository. Set the
# repository variable METACULUS_BOT to "off" to pause the bot.
#
# The polymarket-lab job runs beside them, on its own: pretend trading only
# (public data, no keys, no money), saved to the polymarket-lab-data branch.
# It is the only job that may write, and only that branch. If it fails, the
# forecasting jobs are not affected. Set POLYMARKET_LAB to "off" to pause it.

# Started every 40 minutes (:07 and :47 of even hours, :27 of odd hours, UTC)
# by two cron-job.org jobs that call this workflow's dispatch endpoint; see
# "Metaculus - set up the outside timer". Tournament questions stay open for
# 1.5 to 3 hours, so each gets at least two chances. GitHub's own `schedule`
# trigger first fired more than six hours late for this repository and then
# ran irregularly, and a second starter would double the Actions minutes.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      to_forecast: ${{ steps.precheck.outputs.to_forecast }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Any open questions?
        id: precheck
        if: vars.METACULUS_BOT != 'off'
        working-directory: metaculus-bot
        run: python3 precheck.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}

  forecast:
    needs: check
    if: ${{ needs.check.outputs.to_forecast == 'true' }}
    runs-on: ubuntu-latest
    # A batch of 5 questions usually takes 3-6 minutes; slow hosts can stretch
    # one to about 15 (two 300 s tries per forecast, then parsing).
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: metaculus-bot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: metaculus-bot/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('metaculus-bot/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: poetry run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional overrides, set under Settings -> Secrets and variables -> Actions -> Variables.
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }}
          TOURNAMENT_FORECAST_MODEL: ${{ vars.TOURNAMENT_FORECAST_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          RESEARCHER: ${{ vars.RESEARCHER }}
          FORECAST_REASONING: ${{ vars.FORECAST_REASONING }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
          MAX_QUESTIONS_PER_RUN: ${{ vars.MAX_QUESTIONS_PER_RUN }}
          MAX_COST_PER_RUN_USD: ${{ vars.MAX_COST_PER_RUN_USD }}
          MAX_LLM_CALLS_PER_RUN: ${{ vars.MAX_LLM_CALLS_PER_RUN }}
          QUESTIONS_IN_PARALLEL: ${{ vars.QUESTIONS_IN_PARALLEL }}

  polymarket-lab:
    if: vars.POLYMARKET_LAB != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: write  # for the polymarket-lab-data branch only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pretend trades (Polymarket strategy lab)
        working-directory: polymarket-lab
        run: bash run.sh
        env:
          GH_TOKEN: ${{ github.token }}
