name: Metaculus - forecast new questions

on:
  workflow_dispatch:
  schedule:
    # Every 40 minutes (:07 and :47 of even hours, :27 of odd hours), 36 runs
    # a day. Questions stay open for 1.5 hours, so each gets at least two
    # chances. To run hourly instead, replace these three lines with
    #   - cron: "7 * * * *"
    - cron: "7 */2 * * *"
    - cron: "47 */2 * * *"
    - cron: "27 1-23/2 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: metaculus-bot
    steps:
      - uses: actions/checkout@v4
      # Uses the runner's built-in Python and no packages, so a run with
      # nothing to do ends here in well under a minute.
      - name: Any open questions?
        id: precheck
        run: python3 precheck.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - uses: actions/setup-python@v5
        if: steps.precheck.outputs.has_open == 'true'
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        if: steps.precheck.outputs.has_open == 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached dependencies
        if: steps.precheck.outputs.has_open == 'true'
        uses: actions/cache@v4
        with:
          path: metaculus-bot/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('metaculus-bot/poetry.lock') }}
      - name: Install dependencies
        if: steps.precheck.outputs.has_open == 'true'
        run: poetry install --no-interaction --no-root
      - name: Run bot
        if: steps.precheck.outputs.has_open == 'true'
        run: poetry run python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional overrides, set under Settings -> Secrets and variables -> Actions -> Variables.
          FORECAST_MODEL: ${{ vars.FORECAST_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          RESEARCHER: ${{ vars.RESEARCHER }}
          FORECAST_REASONING: ${{ vars.FORECAST_REASONING }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
          MAX_QUESTIONS_PER_RUN: ${{ vars.MAX_QUESTIONS_PER_RUN }}
          MAX_COST_PER_RUN_USD: ${{ vars.MAX_COST_PER_RUN_USD }}
          MAX_LLM_CALLS_PER_RUN: ${{ vars.MAX_LLM_CALLS_PER_RUN }}
          QUESTIONS_IN_PARALLEL: ${{ vars.QUESTIONS_IN_PARALLEL }}
