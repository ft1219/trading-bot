name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u probe/asknews_balance.py
        env:
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
